<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jrestaurant | Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <a href="index.html" class="header-logo">
        <img src="images/logo.png" alt="Jrestaurant logo">
    </a>
</header>

<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<main>

    <section class="page-title">
        <p class="eyebrow">JRESTAURANT</p>

        <h1>Gallery</h1>

        <div class="gold-line"></div>

        <p>
            Take a look at Jrestaurant and some of our favourite dishes.
        </p>
    </section>


    <section class="gallery-grid">

        <figure class="gallery-item">
            <img
                src="images/restaurant.png"
                alt="Jrestaurant exterior in Dubai"
            >
            <figcaption>Jrestaurant in Dubai</figcaption>
        </figure>


        <figure class="gallery-item">
            <img
                src="images/crispy-chicken-combo.png"
                alt="Crispy Chicken Combo"
            >
            <figcaption>Crispy Chicken Combo</figcaption>
        </figure>


        <figure class="gallery-item">
            <img
                src="images/spicy-chicken-combo.png"
                alt="Spicy Chicken Combo"
            >
            <figcaption>Spicy Chicken Combo</figcaption>
        </figure>


        <figure class="gallery-item">
            <img
                src="images/crispy-fried-chicken.png"
                alt="Crispy Fried Chicken"
            >
            <figcaption>Crispy Fried Chicken</figcaption>
        </figure>


        <figure class="gallery-item">
            <img
                src="images/spicy-chicken.png"
                alt="Spicy Chicken"
            >
            <figcaption>Spicy Chicken</figcaption>
        </figure>


        <figure class="gallery-item">
            <img
                src="images/berry-lemonade.png"
                alt="Berry Lemonade"
            >
            <figcaption>Berry Lemonade</figcaption>
        </figure>


        <figure class="gallery-item">
            <img
                src="images/chocolate-lava-cake.png"
                alt="Chocolate Lava Cake"
            >
            <figcaption>Chocolate Lava Cake</figcaption>
        </figure>

    </section>

</main>


<!-- Full Image Viewer -->

<div class="image-modal" id="imageModal">

    <button
        class="modal-close"
        id="modalClose"
        type="button"
        aria-label="Close image"
    >
        &times;
    </button>

    <img
        id="modalImage"
        src=""
        alt="Enlarged gallery image"
    >

</div>


<footer>

    <p>Dubai, United Arab Emirates</p>

    <p>&copy; 2026 Jrestaurant. All Rights Reserved.</p>

</footer>


<script src="script.js"></script>

</body>
</html>
